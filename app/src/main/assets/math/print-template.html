<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src data:; connect-src 'none'">
<link rel="stylesheet" href="katex.min.css">
<style>
  @page { size: A4; margin: 16mm 15mm 17mm 15mm; }
  html, body { padding: 0; margin: 0; background: white; color: #17212b; }
  body { font-family: Arial, sans-serif; font-size: 9pt; line-height: 1.36; }
  h1, h2, h3, h4 { color: #152d42; margin: 12pt 0 5pt; break-after: avoid; }
  h1 { font-size: 14pt; } h2 { font-size: 11.5pt; } h3 { font-size: 10pt; }
  #title { border-bottom: 1px solid #cdd7df; padding-bottom: 8pt; margin: 0 0 5pt; }
  #warning { color: #6f470e; font-size: 8pt; margin-bottom: 11pt; }
  p, li { orphans: 3; widows: 3; }
  p { margin: 4pt 0; }
  ul, ol { padding-left: 19pt; }
  li { padding-bottom: 3pt; }
  table { border-collapse: collapse; margin: 7pt 0; width: 100%; table-layout: fixed; font-size: 8.4pt; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  th, td { border: 1px solid #9cabba; padding: 4pt 5pt; overflow-wrap: break-word; word-break: normal; text-align: left; vertical-align: top; }
  th { background: #eef3f8; }
  blockquote { border-left: 3px solid #a3b5c7; margin: 9pt 0; padding-left: 12pt; color: #465768; }
  code { font-family: monospace; font-size: 9.5pt; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f1f3f5; padding: 8pt; }
  .katex-display { margin: 8pt 0; font-size: 1em; overflow: visible; }
  .katex { max-width: 100%; }
  .math-block { page-break-inside: avoid; text-align: center; }
  .math-error { background: #fff0f0; border: 1px solid #aa3344; }
  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    h1, h2, h3, h4, tr, .katex-display { break-inside: avoid; }
  }
</style>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
</head>
<body>
<h1 id="title"></h1>
<p id="warning">ESBORRANY — revisa els continguts, els càlculs i les fonts abans d'utilitzar-los o compartir-los.</p>
<main id="content"></main>
<script>
(function () {
  "use strict";
  const titleEncoded = "__LECTAV_TITLE_B64__";
  const textEncoded = "__LECTAV_CONTENT_B64__";
  function decode(input) {
    return new TextDecoder("utf-8").decode(Uint8Array.from(
      atob(input), c => c.charCodeAt(0)
    ));
  }
  function escapeHtml(value) {
    return value.replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function report(error, layout) {
    if (window.LECTAV && window.LECTAV.complete) {
      window.LECTAV.complete(error || "", layout ? JSON.stringify(layout) : "");
    }
  }

  // A WebView drawn into PdfDocument does not honour CSS @page breaks.
  // Compute safe explicit cuts in document CSS coordinates before drawing.
  function paginate() {
    const cssWidth = document.documentElement.clientWidth || window.innerWidth;
    if (!(cssWidth >= 250)) throw new Error("Amplada de pàgina no vàlida.");
    // Android A4 points: page 595 x 842; margins 42 on all four sides.
    // Reserve 14 CSS pixels so rounding never touches the next block.
    const pageHeight = 758 * cssWidth / 511 - 14;
    const nodes = [
      document.getElementById("title"),
      document.getElementById("warning"),
      ...document.getElementById("content").children
    ];
    const top = element => element.getBoundingClientRect().top + window.scrollY;
    const bottom = element => element.getBoundingClientRect().bottom + window.scrollY;
    // A title, a lead-in such as "Resol els exercicis següents:", or a
    // short caption belongs on the same page as the next content block.
    function keepWithNext(element) {
      if (/^H[1-6]$/.test(element.tagName)) return true;
      if (!/^(P|DIV|FIGCAPTION|DT|STRONG)$/.test(element.tagName)) return false;
      const text = (element.textContent || "").trim();
      if (text.length < 2 || text.length > 240) return false;
      return /[:：]$/.test(text) ||
        /(?:següents|siguientes|following|a continuació|a continuación|below|exemples|ejemplos)\\s*[.!]?$/i.test(text);
    }
    const candidates = [0];
    let groupStart = null;
    let previousKeep = false;
    for (const el of nodes) {
      const elementTop = top(el);
      const elementBottom = bottom(el);
      const blockHeight = elementBottom - elementTop;
      if (blockHeight > pageHeight - 4) {
        throw new Error(el.tagName === "TABLE"
          ? "La taula no cap sencera en una pàgina. Divideix-la en dues taules."
          : "Hi ha un bloc massa llarg. Divideix-lo en fragments més curts.");
      }
      // A chain such as heading → introductory paragraph: → table is one
      // indivisible unit for page-break purposes.
      if (groupStart === null) groupStart = elementTop;
      if (elementBottom - groupStart > pageHeight - 4) {
        throw new Error(
          "Un títol o una introducció i el contingut següent no caben junts. " +
          "Divideix el bloc abans de desar el PDF."
        );
      }
      if (elementTop > 0 && !previousKeep) {
        candidates.push(Math.floor(elementTop));
        groupStart = elementTop;
      }
      previousKeep = keepWithNext(el);
    }
    const totalHeight = Math.ceil(Math.max(
      document.documentElement.scrollHeight, document.body.scrollHeight
    ));
    const pages = [];
    let start = 0;
    while (totalHeight - start > pageHeight) {
      const options = candidates.filter(y => y > start + 5 && y <= start + pageHeight);
      const next = options.length ? Math.max(...options) : -1;
      if (next <= start + 5) {
        throw new Error("No hi ha un salt de pàgina segur. Divideix el bloc més llarg.");
      }
      pages.push([start, next]);
      start = next;
      if (pages.length >= 40) throw new Error("El document supera 40 pàgines.");
    }
    pages.push([start, totalHeight]);
    return { viewportWidth: cssWidth, pages: pages };
  }

  try {
    if (typeof window.markdownit !== "function" || !window.katex) {
      throw new Error("Falten les biblioteques matemàtiques locals.");
    }
    const title = decode(titleEncoded);
    const raw = decode(textEncoded);
    document.getElementById("title").textContent = "LECTAV — " + title;
    const tokens = [];
    const problems = [];
    // Isolate TeX *before* Markdown handles underscores, backslashes or stars.
    // Accept standard display and inline delimiters, plus $$...$$ and $...$.
    const math = /\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$\$[\s\S]*?\$\$|\$(?!\$)(?:\\.|[^$\n])+\$/g;
    const prepared = raw.replace(math, function (original) {
      const display = original.startsWith("\\[") || original.startsWith("$$");
      const size = display || original.startsWith("\\(") ? 2 : 1;
      const formula = original.slice(size, -size);
      const marker = "LECTAVMATHTOKEN" + tokens.length + "END";
      try {
        const formatted = window.katex.renderToString(formula, {
          displayMode: display, throwOnError: true, trust: false,
          output: "htmlAndMathml", maxExpand: 1000, strict: "warn"
        });
        tokens.push(display ? '<div class="math-block">' + formatted + '</div>' : formatted);
      } catch (e) {
        problems.push((e && e.message) || "Sintaxi LaTeX incorrecta");
        tokens.push('<code class="math-error">' + escapeHtml(original) + '</code>');
      }
      return marker;
    });
    if (problems.length > 0) {
      throw new Error(problems.length + " fórmula(es) LaTeX sense interpretar. Revisa l'esborrany.");
    }
    const parser = window.markdownit({
      html: false, breaks: true, linkify: false, typographer: false
    });
    const rendered = parser.render(prepared)
      .replace(/<p>LECTAVMATHTOKEN(\d+)END<\/p>/g,
        function (_, index) { return tokens[Number(index)] || ""; })
      .replace(/LECTAVMATHTOKEN(\d+)END/g,
        function (_, index) { return tokens[Number(index)] || ""; });
    document.getElementById("content").innerHTML = rendered;
    // Give four-column teaching tables usable space for collection names,
    // mathematical symbols, descriptions and examples.
    document.querySelectorAll("#content table").forEach(function (table) {
      const row = table.querySelector("tr");
      if (row && row.children.length === 4) {
        const group = document.createElement("colgroup");
        [22, 13, 40, 25].forEach(function (percent) {
          const col = document.createElement("col");
          col.style.width = percent + "%";
          group.appendChild(col);
        });
        table.insertBefore(group, table.firstChild);
      }
    });

    Promise.resolve(document.fonts.ready).then(function () {
      requestAnimationFrame(function () {
        try { report("", paginate()); }
        catch (error) { report(error.message || "No es pot paginar el PDF."); }
      });
    }, function () { report("No s'han pogut carregar les fonts de les fórmules."); });
  } catch (e) {
    report((e && e.message) || "No s'ha pogut preparar el PDF.");
  }
})();
</script>
</body>
</html>
