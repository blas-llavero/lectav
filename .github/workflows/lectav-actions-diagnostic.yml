name: LECTAV Actions startup diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/lectav-actions-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify GitHub runner starts
        run: echo "LECTAV Actions runner started successfully"
