name: Build and sign LECTAV APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle offline mathematical renderer (KaTeX + Markdown-it)
        run: bash scripts/prepare_pdf_math_assets.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test mathematical speech normalization
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Sign APK with persistent LECTAV key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          LECTAV_KEYSTORE_B64: ${{ secrets.LECTAV_KEYSTORE_B64 }}
          LECTAV_KEYSTORE_PASSWORD: ${{ secrets.LECTAV_KEYSTORE_PASSWORD }}
          LECTAV_CERT_SHA256: ${{ vars.LECTAV_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$LECTAV_KEYSTORE_B64" || -z "$LECTAV_KEYSTORE_PASSWORD" || -z "$LECTAV_CERT_SHA256" ]]; then
            echo '::error::Permanent signing is not configured. No installable APK will be published.'
            exit 1
          fi
          keyfile=$(mktemp "$RUNNER_TEMP/lectav-key.XXXXXX")
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$LECTAV_KEYSTORE_B64" | base64 --decode > "$keyfile"
          unset LECTAV_KEYSTORE_B64
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p app/build/outputs/apk/signed
          output=app/build/outputs/apk/signed/lectav.apk
          "$signer" sign --ks "$keyfile" --ks-type PKCS12 --ks-key-alias lectav \
            --ks-pass env:LECTAV_KEYSTORE_PASSWORD --key-pass env:LECTAV_KEYSTORE_PASSWORD \
            --out "$output" app/build/outputs/apk/debug/app-debug.apk
          unset LECTAV_KEYSTORE_PASSWORD
          report=$("$signer" verify --verbose --print-certs "$output")
          actual=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$LECTAV_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo '::error::APK signing certificate does not match the pinned fingerprint.'
            exit 1
          fi
          printf 'Verified LECTAV certificate SHA-256: %s\n' "$actual"
      - name: Upload verified installable APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lectav-signed-apk
          path: app/build/outputs/apk/signed/lectav.apk
          if-no-files-found: error
